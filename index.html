<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Iframes Example</title>
    <style>
        /* 基本設置 */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f4f4;
        }

        .iframe-container {
            margin: 10px 0;
            position: relative;
            width: 100%;
            overflow: hidden;
            background-color: #000;
            border-radius: 8px;
        }

        .iframe-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        /* 設定 10 個不同尺寸的 iframe */
        .iframe-container.small {
            max-width: 300px;
            height: 170px;
        }

        .iframe-container.medium {
            max-width: 480px;
            height: 270px;
        }

        .iframe-container.large {
            max-width: 640px;
            height: 360px;
        }

        .iframe-container.xlarge {
            max-width: 800px;
            height: 450px;
        }

        .iframe-container.xxlarge {
            max-width: 960px;
            height: 540px;
        }

        .iframe-container.full {
            max-width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <h1>Responsive Iframes Example</h1>

    <!-- 小尺寸 -->
    <div class="iframe-container small">
        <iframe src="https://www.youtube.com/embed/DaSQP2j3_ak?si=RhP6JyxOgxuI3tgv" title="YouTube video player" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
    </div>

    <!-- 中等尺寸 -->
    <div class="iframe-container medium">
        <iframe src="https://www.youtube.com/embed/DaSQP2j3_ak?si=RhP6JyxOgxuI3tgv" title="YouTube video player" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
    </div>

    <!-- 大尺寸 -->
    <div class="iframe-container large">
        <iframe src="https://www.youtube.com/embed/DaSQP2j3_ak?si=RhP6JyxOgxuI3tgv" title="YouTube video player" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
    </div>

    <!-- 超大尺寸 -->
    <div class="iframe-container xlarge">
        <iframe src="https://www.youtube.com/embed/DaSQP2j3_ak?si=RhP6JyxOgxuI3tgv" title="YouTube video player" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
    </div>

    <!-- 更大尺寸 -->
    <div class="iframe-container xxlarge">
        <iframe src="https://www.youtube.com/embed/DaSQP2j3_ak?si=RhP6JyxOgxuI3tgv" title="YouTube video player" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
    </div>

    <!-- 100% 寬度的全屏 iframe -->
    <div class="iframe-container full">
        <iframe src="https://www.youtube.com/embed/DaSQP2j3_ak?si=RhP6JyxOgxuI3tgv" title="YouTube video player" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
    </div>

</body>
</html>
